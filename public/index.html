<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>留言墙</title>
  <meta name="description" content="把想说的话留在墙上，最新留言排在最前面。" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="eyebrow">FEEDBACK WALL</div>
      <h1>留言墙</h1>
      <p class="sub">把想说的话留在墙上，最新留言会排在最前面。</p>
    </header>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <form id="message-form" class="card form" novalidate>
      <div class="field">
        <label for="nickname">昵称<span class="req" aria-hidden="true">*</span></label>
        <input id="nickname" name="nickname" type="text" placeholder="怎么称呼你？" autocomplete="nickname" />
        <div class="field-error" id="nickname-error" aria-live="polite"></div>
      </div>

      <div class="field">
        <label for="content">留言内容<span class="req" aria-hidden="true">*</span></label>
        <textarea id="content" name="content" placeholder="写点什么吧…（最多 200 字）"></textarea>
        <div class="meta-row">
          <div class="field-error" id="content-error" aria-live="polite"></div>
          <div class="counter" id="counter">0/200</div>
        </div>
      </div>

      <div class="actions">
        <button class="primary" id="submit" type="submit">提交留言</button>
        <span class="hint">昵称最多 30 字，留言最多 200 字</span>
      </div>
      <div class="form-error" id="form-error" role="alert"></div>
    </form>

    <div class="list-head">
      <h2>全部留言</h2>
      <span class="count" id="count"></span>
    </div>
    <div id="list" class="list" aria-live="polite"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
